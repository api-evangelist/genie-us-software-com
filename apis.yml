aid: genie-us-software-com
name: Genie-us Software, Inc.
description: 'Genie-us Software, Inc. sells CoreOS v1.0, a governance-first set of custom skills, operating
  instructions and boundaries installed into the AI environment a person already uses (ChatGPT as a Markdown
  install package, Claude Code as a skills ZIP) — no hosted runtime, one $499 one-time license per person,
  with DiscoveryPass as the free seven-day evaluation. Rather than an API, the company publishes a small
  machine-readable commercial discovery surface for agents: an A2A agent card at /.well-known/agent-card.json
  (discovery-only — no A2A endpoint is deployed), a commerce manifest, and static JSON documents for products,
  capabilities, evidence, health and a JSON Schema qualification request.'
