apis:
- aid: genie-us-software-com:machine-commerce-discovery
  name: Genie-us Software Machine Commerce Discovery
  description: 'Six static, anonymous, read-only JSON documents the provider publishes for agents under
    /machine/ and /.well-known/, mapped by its commerce manifest: products (SKU, price, delivery), capabilities
    (with explicit agent boundaries), evidence (which public pages ground a claim), a JSON Schema draft 2020-12
    qualification request, and a health document whose flags say dynamic qualification, agent checkout and
    artifact fulfillment are not yet live. No OpenAPI, no authentication, no write operation.'
  humanURL: https://www.genie-us-software.com/trust/
